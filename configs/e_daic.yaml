# ---------------------------------------------------------------------------
# CIEDep-Net / E-DAIC
# 논문: Hierarchical Modeling of Human Language Processing with Large Language
#       Model for Multimodal Depression Detection (TAFFC-2025-08-0826)
# ---------------------------------------------------------------------------
dataset:
  name: e_daic
  # DAIC-WOZ 원본 배포본 (참가자별 <ID>_P/ 폴더에 AUDIO.wav, TRANSCRIPT.csv)
  raw_dir: "D:/__Journal_Audio/E_DAIC/data"
  transcript_suffix: "_Transcript.csv"
  audio_suffix: "_AUDIO.wav"
  # transcript 컬럼명 (DAIC-WOZ 원본 스키마)
  # E-DAIC transcript는 참가자 발화 구간만 Start_Time/End_Time으로 제공한다.
  transcript_columns:
    start: Start_Time
    stop: End_Time
    speaker: null
    text: Text
  interviewer_label: Interviewer
  participant_label: Participant
  # 라벨 CSV
  label_csv: "D:/__Journal_Audio/E_DAIC/E_DAIC_Class_split_csv.csv"
  label_columns:
    participant_id: Participant_ID
    phq_score: PHQ_Score
    phq_class: PHQ_three
  # E-DAIC는 제외 참가자 없음 (275명 전원 사용)
  excluded_indices: []

paths:
  # 참가자 발화만 이어붙인 음성
  participant_dir: "D:/__Journal_Audio/E_DAIC/Participant_data"
  # 소수 클래스 증강본
  augment_moderate_dir: "D:/__Journal_Audio/E_DAIC/Augment/Moderate"
  augment_severe_dir: "D:/__Journal_Audio/E_DAIC/Augment/Severe"
  # 턴 단위 오디오 / Whisper 전사 결과
  turn_dir: "D:/__Journal_Audio/E_DAIC/Turn"
  transcript_pkl: "D:/__Journal_Audio/E_DAIC/Whisper/Whisper_output_f.pkl"
  # LLM 산출물
  llm_dir: "D:/__Journal_Audio/E_DAIC/LLM_output"
  # 특징
  feature_dir: "D:/__Journal_Audio/E_DAIC/data_feature"
  mel_pkl: "D:/__Journal_Audio/E_DAIC/data_feature/melspectrogram.pkl"
  # 체크포인트 / 결과
  checkpoint_dir: "./outputs/e_daic/checkpoints"
  result_dir: "./outputs/e_daic/results"

audio:
  sample_rate: 16000
  window_sec: 4.0      # Table I: 4s가 최적
  hop_sec: 3.0         # 1s overlap
  n_mels: 80
  frame_length_sec: 0.025
  frame_stride_sec: 0.010
  top_db: 80.0
  # 참가자당 세그먼트 평균 길이 (제로패딩 기준). null 이면 데이터에서 자동 계산
  pad_length: 159

augment:
  # PHQ-8 3구간: 0-9 non, 10-14 moderate, 15-24 severe
  class_bins: [9, 14]
  pitch_shift_range: [-3.0, 3.0]
  pitch_min_gap: 0.5
  time_stretch_range: [0.85, 1.15]
  time_min_gap: 0.05
  # 소수 클래스별 추가 생성 수 (moderate 43 + 146 = 189, severe 43 + 146 = 189,
  # non-depressed 189 -> 세 클래스 모두 189, 총 567 샘플)
  moderate_extra: 146
  severe_extra: 146

llm:
  model_id: "Qwen/Qwen2.5-7B-Instruct"
  prompt_strategy: cot_self_consistency   # standard | cot | cot_self_consistency | cot_self_validation
  n_samples: 5            # self-consistency 샘플 수
  temperature: 0.8
  top_p: 0.9
  max_new_tokens: 1024
  max_new_tokens_score: 32
  score_scale: 24.0       # 0~1 생성 점수를 PHQ-8 범위로 환산할 때
  sentence_embedder: "all-mpnet-base-v2"   # 768-d

features:
  expression_model: wav2vec2   # wav2vec2 | hubert | wavlm | unispeech_sat
  ssl_model_ids:
    wav2vec2: "facebook/wav2vec2-base-960h"
    hubert: "facebook/hubert-large-ls960-ft"
    wavlm: "microsoft/wavlm-large"
    unispeech_sat: "microsoft/unispeech-sat-base"
  whisper_model: "large"

model:
  d_input: 80            # mel bins
  d_expr: 768            # wav2vec 2.0 차원
  d_summary: 768         # all-mpnet-base-v2 차원
  d_output: 1
  # Cognition: 3-layer Bi-LSTM + LayerNorm
  lstm_hidden_dims: [64, 128, 256]
  lstm_bidirectional: true
  # Interpretation: Transformer encoder
  transformer_heads: 4
  transformer_layers: 2
  transformer_ff_dim: 512
  summary_transformer_heads: 4
  # Expression: Conformer
  expression_backbone: conformer   # conformer | transformer
  conformer_layers: 4
  conformer_heads: 4
  conformer_ff_expansion: 4
  conformer_conv_expansion: 2
  conformer_kernel_size: 31
  dropout: 0.1
  half_step_residual: true

train:
  seed: 128
  n_splits: 5
  test_size: 0.2
  batch_size: 64
  num_epochs: 500
  lr: 1.0e-4
  weight_decay: 5.0e-5
  warmup_epochs: 10
  eta_min: 1.0e-6
  early_stopping_patience: 15
  loss: huber
  scale_expression_feature: true   # fold별 StandardScaler
